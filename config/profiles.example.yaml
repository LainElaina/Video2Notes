# Video2Notes architecture/profile reference
#
# This YAML is documentation, NOT a file loaded directly at runtime.  The
# running CLI/API persists the validated JSON schema at
# DATA_ROOT/config/providers.json.  It deliberately contains only local paths
# and Windows Credential Manager references; never put a raw API key, Cookie,
# SESSDATA, Authorization header, or cookies.txt contents in configuration.

schema_version: 1

providers:
  local:
    id: local
    display_name: Local engines
    kind: local
    locality: local
    enabled: true

  compatible_llm:
    id: compatible_llm
    display_name: OpenAI-compatible provider
    kind: openai_compatible
    base_url: https://provider.example/v1
    endpoint_style: chat_completions # alternative supported value: responses
    credential_ref: keyring://Video2Notes/providers/compatible_llm
    request_timeout_seconds: 180
    locality: cloud
    enabled: false # enable only after endpoint, model and secret are ready

  ollama:
    id: ollama
    display_name: Local Ollama
    kind: ollama
    base_url: http://127.0.0.1:11434/v1
    endpoint_style: chat_completions
    request_timeout_seconds: 180
    locality: local
    enabled: false

models:
  paddleocr-local:
    id: paddleocr-local
    provider_id: local
    model_id: paddleocr
    display_name: PaddleOCR local files
    capabilities: [ocr, ocr_boxes, ocr_confidence]
    locality: local
    settings:
      engine: paddleocr
      # Both paths must already exist and contain local model files.  The
      # adapter refuses network downloads at inference time.
      detection_model_dir: D:/Models/ppocr/det
      recognition_model_dir: D:/Models/ppocr/rec
      language: ch
      device: cpu # install a matching Paddle GPU wheel before using gpu:0
      # PaddleOCR 3.7 + PaddlePaddle 3.3.1 Windows CPU was verified with
      # oneDNN disabled; omit/enable only after testing your engine build.
      enable_mkldnn: false
      api_family: auto
    enabled: false

  faster-whisper-primary:
    id: faster-whisper-primary
    provider_id: local
    model_id: faster-whisper
    display_name: faster-whisper primary
    capabilities: [asr, language_id, segment_timestamps, word_timestamps, word_confidence]
    locality: local
    settings:
      engine: faster_whisper
      # Explicit local directory: local_files_only=True is used at runtime.
      model_path: D:/Models/faster-whisper-large-v3
      device: cuda # CPU alternative: cpu
      compute_type: float16 # CPU alternative: int8
      beam_size: 5
      vad_filter: true
      # Multiple UI/CLI language hints enable multilingual decoding and
      # preserve per-segment language probability/method in evidence.
      multilingual: true
      language_detection_threshold: 0.70
      language_detection_segments: 3
    enabled: false

  faster-whisper-secondary:
    id: faster-whisper-secondary
    provider_id: local
    model_id: faster-whisper
    display_name: faster-whisper selective secondary
    capabilities: [asr, language_id, segment_timestamps, word_timestamps, word_confidence]
    locality: local
    settings:
      engine: faster_whisper
      model_path: D:/Models/faster-whisper-large-v3-turbo
      device: cuda
      compute_type: float16
      beam_size: 5
      vad_filter: true
      multilingual: true
      language_detection_threshold: 0.70
      language_detection_segments: 3
    enabled: false

  compatible-notes:
    id: compatible-notes
    provider_id: compatible_llm
    model_id: configure-a-real-model-id
    display_name: Structured evidence note LLM
    capabilities: [text, structured_output, long_context]
    locality: cloud
    context_window: 65536
    settings: {}
    enabled: false

  ollama-notes:
    id: ollama-notes
    provider_id: ollama
    model_id: configure-a-real-ollama-model-id
    display_name: Local structured note LLM
    capabilities: [text, structured_output, long_context]
    locality: local
    context_window: 32768
    settings: {}
    enabled: false

roles:
  # Adaptive visual change detection is deterministic pipeline configuration
  # in v0.1, not a model role. The runtime currently consumes only the ASR,
  # OCR, and notes roles shown below.
  ocr.primary:
    role: ocr.primary
    primary_model_id: paddleocr-local
    fallback_model_ids: []

  asr.primary:
    role: asr.primary
    primary_model_id: faster-whisper-primary
    fallback_model_ids: []

  # The runner invokes this only on the mode-allowed uncertain/conflicting
  # time windows, never blindly across the full video.
  asr.secondary:
    role: asr.secondary
    primary_model_id: faster-whisper-secondary
    fallback_model_ids: []

  notes.fact_extractor:
    role: notes.fact_extractor
    primary_model_id: compatible-notes
    fallback_model_ids: [ollama-notes]

  notes.drafter:
    role: notes.drafter
    primary_model_id: compatible-notes
    fallback_model_ids: [ollama-notes]

  notes.verifier:
    role: notes.verifier
    primary_model_id: compatible-notes
    fallback_model_ids: [ollama-notes]

quality_intent:
  # Quality intent is selected per task (--mode), then composed with detected
  # hardware.  It is not selected merely from GPU name.
  fast:
    visual: { analysis_width: 480, coarse_fps: 2, fine_fps: 6 }
    asr: { model_class: small, secondary: off }
    notes: { verifier: off, screenshots: adaptive_representative }
  balanced:
    visual: { analysis_width: 768, coarse_fps: 3, fine_fps: 12 }
    asr: { model_class: large-v3-turbo, secondary: caption_or_language_conflicts }
    notes: { verifier: configured_role, screenshots: adaptive_representative }
  accurate:
    visual: { analysis_width: 1080, coarse_fps: 6, fine_fps: 24 }
    asr: { model_class: large-v3, secondary: uncertain_missing_and_conflicts }
    notes: { verifier: configured_role, screenshots: adaptive_representative }
