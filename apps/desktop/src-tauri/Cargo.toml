[package]
name = "video2notes-desktop"
version = "0.2.0"
description = "Evidence-first local video note workstation"
authors = ["LainElaina <1796137367@qq.com>"]
edition = "2021"

[lib]
name = "video2notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
