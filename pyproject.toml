[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video2notes"
version = "0.1.0"
description = "Evidence-first, high-precision video to notes pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "av>=14.2,<17",
  "platformdirs>=4.3,<5",
  "Pillow>=10.4,<13",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "yt-dlp[default]==2026.7.4",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]
secrets = [
  "keyring>=25.6,<27",
]
asr = [
  "faster-whisper>=1.1,<2",
]
ocr = [
  "paddlepaddle>=3.3,<4; platform_system == 'Windows'",
  "paddleocr>=3.1,<4",
]
render = [
  "markdown-it-py>=3,<5",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
video2notes = "video2notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video2notes"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["video2notes"]

[tool.coverage.report]
show_missing = true
skip_covered = true
