[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video2notes"
version = "0.1.0"
description = "Evidence-first, high-precision video to notes pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "av>=14.2,<17",
  "platformdirs>=4.3,<5",
  "Pillow>=10.4,<13",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "yt-dlp[default]==2026.7.4",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]
secrets = [
  "keyring>=25.6,<27",
]
asr = [
  "ctranslate2>=4.4,<5",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.34,<2",
  # Keep the Windows CUDA stack identical to the Paddle GPU runtime verified
  # by the same-process OCR -> ASR compatibility probe.  In particular, two
  # different cuDNN builds with the same DLL basename are unsafe on Windows.
  "nvidia-cublas-cu12==12.9.0.13; platform_system == 'Windows'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; platform_system == 'Windows'",
  "nvidia-cudnn-cu12==9.9.0.52; platform_system == 'Windows'",
  "nvidia-nvjitlink-cu12==12.9.86; platform_system == 'Windows'",
]
ocr = [
  "huggingface-hub>=0.34,<2",
  "paddlepaddle>=3.3,<4; platform_system == 'Windows'",
  "paddleocr>=3.1,<4",
]
# The official Paddle CUDA wheel is intentionally installed by
# scripts/bootstrap.ps1 -WithOcrGpu from Paddle's cu129 index.  A portable
# PEP 508 requirement cannot choose the correct CPython/Windows wheel from
# that non-PyPI index, so this extra declares every other dependency exactly.
# Do not combine this extra with ``ocr``; bootstrap enforces the exclusivity.
ocr-gpu = [
  "huggingface-hub>=0.34,<2",
  "paddleocr==3.7.0",
  "nvidia-cuda-runtime-cu12==12.9.37; platform_system == 'Windows'",
  "nvidia-cublas-cu12==12.9.0.13; platform_system == 'Windows'",
  "nvidia-cudnn-cu12==9.9.0.52; platform_system == 'Windows'",
  "nvidia-cufft-cu12==11.4.0.6; platform_system == 'Windows'",
  "nvidia-curand-cu12==10.3.10.19; platform_system == 'Windows'",
  "nvidia-cusolver-cu12==11.7.4.40; platform_system == 'Windows'",
  "nvidia-cusparse-cu12==12.5.9.5; platform_system == 'Windows'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; platform_system == 'Windows'",
  "nvidia-nvjitlink-cu12==12.9.86; platform_system == 'Windows'",
]
render = [
  "markdown-it-py>=3,<5",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pyinstaller==6.21.0",
  "ruff>=0.9,<1",
]

[project.scripts]
video2notes = "video2notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video2notes"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["video2notes"]

[tool.coverage.report]
show_missing = true
skip_covered = true
